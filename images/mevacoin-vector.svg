<?xml version="1.0" encoding="UTF-8"?>
<!-- MevaCoin Logo — Gold version (replaces Monero orange) -->
<svg version="1.1" viewBox="0 0 6000 6000" xml:space="preserve"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:cc="http://creativecommons.org/ns#"
   xmlns:dc="http://purl.org/dc/elements/1.1/"
   xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#">
  <metadata>
    <rdf:RDF>
      <cc:Work rdf:about="">
        <dc:format>image/svg+xml</dc:format>
        <dc:type rdf:resource="http://purl.org/dc/dcmitype/StillImage"/>
        <dc:title>MevaCoin</dc:title>
      </cc:Work>
    </rdf:RDF>
  </metadata>
  <defs>
    <clipPath id="a">
      <path d="m0 4500h4500v-4500h-4500z"/>
    </clipPath>
    <!-- Gold gradient for the coin -->
    <radialGradient id="goldGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%"   stop-color="#F0C040"/>
      <stop offset="50%"  stop-color="#C9A020"/>
      <stop offset="100%" stop-color="#8B6010"/>
    </radialGradient>
    <!-- Silver ring gradient -->
    <radialGradient id="silverGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#E8E8E8"/>
      <stop offset="100%" stop-color="#A8A9AD"/>
    </radialGradient>
  </defs>
  <g transform="matrix(1.3333 0 0 -1.3333 0 6e3)">
    <g clip-path="url(#a)">
      <!-- Outer silver ring -->
      <g transform="translate(4128 2250.2)">
        <path d="m0 0c0-1037.2-840.79-1878.1-1878.1-1878.1-1037.2 0-1878 840.88-1878 1878.1 0 1037.3 840.8 1878.1 1878 1878.1 1037.3 0 1878.1-840.79 1878.1-1878.1" fill="url(#silverGrad)"/>
      </g>
      <!-- Gold inner coin face — upper M (white for contrast) -->
      <g transform="translate(2250 4128.2)">
        <path d="m0 0c-1036.9 0-1879.1-842.06-1877.8-1878 0.262-207.26 33.308-406.63 95.342-593.12h561.88v1579.9l1220.6-1220.6 1220.6 1220.6v-1579.9h561.96c62.117 186.48 95.008 385.85 95.369 593.12 1.809 1037-840.89 1877.8-1877.9 1877.8z" fill="url(#goldGrad)"/>
      </g>
      <!-- Lower M shape — dark gold -->
      <g transform="translate(1969.3 1735.8)">
        <path d="m0 0-532.67 532.7v-994.14h-407.26l-384.29-0.07c329.63-540.8 925.35-902.56 1604.9-902.56 679.54 0 1275.3 361.85 1605 902.65l-384.44-0.013h-407.27v994.14l-813.3-813.31-280.62 280.61z" fill="#FFFFFF" opacity="0.85"/>
      </g>
    </g>
  </g>
